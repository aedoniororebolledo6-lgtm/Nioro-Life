name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK
        id: gradle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar errores de compilación
        if: failure() && steps.gradle.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Execution failed" -A4 build.log | head -c 100000 > err.txt || true
          [ -s err.txt ] || tail -c 20000 build.log > err.txt
          gh release delete build-error --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create build-error --repo "$GITHUB_REPOSITORY" --title "Error de compilacion" --notes-file err.txt --prerelease

      - name: Limpiar aviso de error anterior
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete build-error --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Preparar archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk NioroLife.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NioroLife-apk
          path: NioroLife.apk

      - name: Publicar enlace de descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NioroLife.apk \
            --title "Nioro Life" \
            --notes "build:${{ github.run_number }} · Descarga NioroLife.apk e instálalo en tu Samsung." \
            --latest

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NioroLife-apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash ci/smoke.sh

      - name: Publicar informe de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f report.txt ] || echo "No se generó informe" > report.txt
          tr -cd '\11\12\15\40-\176\200-\377' < report.txt | head -c 60000 > notes.txt
          [ -s notes.txt ] || echo "Informe vacío" > notes.txt
          gh release delete diagnostico --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create diagnostico --repo "$GITHUB_REPOSITORY" --title "Diagnostico" --notes-file notes.txt --prerelease || echo "No se pudo crear el release"
          for f in report.txt *.png; do
            [ -f "$f" ] && { gh release upload diagnostico "$f" --clobber --repo "$GITHUB_REPOSITORY" || echo "No se pudo subir $f"; }
          done
          exit 0
