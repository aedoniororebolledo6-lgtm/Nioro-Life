name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk NioroLife.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NioroLife-apk
          path: NioroLife.apk

      - name: Publicar enlace de descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NioroLife.apk \
            --title "Nioro Life" \
            --notes "Descarga NioroLife.apk e instálalo en tu Samsung." \
            --latest

  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NioroLife-apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash ci/smoke.sh

      - name: Publicar informe de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f report.txt ] || echo "No se generó informe" > report.txt
          head -c 100000 report.txt > notes.txt
          gh release delete diagnostico --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          FILES="report.txt"; [ -s screen.png ] && FILES="$FILES screen.png"
          gh release create diagnostico $FILES --repo "$GITHUB_REPOSITORY" --title "Diagnostico" --notes-file notes.txt --prerelease
