name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk NioroLife.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NioroLife-apk
          path: NioroLife.apk

      - name: Publicar enlace de descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NioroLife.apk \
            --title "Nioro Life" \
            --notes "Descarga NioroLife.apk e instálalo en tu Samsung." \
            --latest
